<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Carnet d'habitudes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F6F7F4; --surface:#FFFFFF; --ink:#1E2420; --muted:#69726B; --line:#E0E5DF;
  --accent:#2E7A54; --accent-ink:#FFFFFF; --soft:#E3EFE7; --warn:#B7791F;
  --h0:#E6E9E4; --h1:#C6E3CF; --h2:#8FCBA5; --h3:#4FA877; --h4:#23804F; --h5:#0E4F2E;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191B19; --surface:#202321; --ink:#E7EBE6; --muted:#949C95; --line:#323733;
    --accent:#5DBE8A; --accent-ink:#0F1A13; --soft:#243A2D; --warn:#E0A94A;
    --h0:#2A2E2B; --h1:#1E3F2C; --h2:#276B45; --h3:#3A9C63; --h4:#62C98C; --h5:#B4F5CF;
  }
}
:root[data-theme="dark"]{
  --ground:#191B19; --surface:#202321; --ink:#E7EBE6; --muted:#949C95; --line:#323733;
  --accent:#5DBE8A; --accent-ink:#0F1A13; --soft:#243A2D; --warn:#E0A94A;
  --h0:#2A2E2B; --h1:#1E3F2C; --h2:#276B45; --h3:#3A9C63; --h4:#62C98C; --h5:#B4F5CF;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:22px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.sample{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:16px;line-height:1}
.nav button:hover:not(:disabled){background:var(--soft)}
.nav button:disabled{opacity:.35;cursor:default}
.range{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:118px;text-align:center}

.grid-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th{font-weight:500;font-size:12px;color:var(--muted);padding:0 0 8px}
th.day{width:44px;text-align:center}
th.day small{display:block;font-family:var(--mono);font-size:11px}
th.day.is-today{color:var(--accent)}
th.name,td.name{text-align:left}
th.streak{width:64px;text-align:right}
td{padding:4px 0;border-top:1px solid var(--line)}
td.name{padding-right:10px}
.hname{display:flex;align-items:center;gap:6px}
.hname span{overflow-wrap:anywhere}
.del{opacity:0;border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:6px;flex:none}
tr:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--soft);color:var(--ink)}
td.cell{text-align:center}
td.cell.is-today{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 55%,var(--line));background:transparent;cursor:pointer;display:inline-grid;place-items:center;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.dot:hover:not(:disabled){border-color:var(--accent)}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot[aria-pressed="true"]::after{content:"";width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-1px) rotate(-45deg)}
.dot:active:not(:disabled){transform:scale(.9)}
.dot:disabled{opacity:.3;cursor:default}
td.streak{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.streak.hot{color:var(--accent);font-weight:500}

.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add input{flex:1 1 200px;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ground)}
.btn{padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}

.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-columns:auto repeat(18,1fr);gap:3px;min-width:420px}
.heat .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);padding-right:6px;line-height:14px}
.heat i{display:block;aspect-ratio:1;max-width:100%;border-radius:3px;background:var(--h0)}
.heat i.l1{background:var(--h1)} .heat i.l2{background:var(--h2)} .heat i.l3{background:var(--h3)} .heat i.l4{background:var(--h4)} .heat i.l5{background:var(--h5)}
.heat i.future{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.heat i.today{box-shadow:0 0 0 1.5px var(--ink)}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.months{display:grid;grid-template-columns:auto repeat(18,1fr);gap:3px;min-width:420px;margin-bottom:4px}
.months span{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:visible}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="today-label"></div>
      <h1>Mes habitudes</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="sample" id="sample" hidden>
    <span>Données d'exemple pour te montrer le rendu.</span>
    <button class="linkbtn" id="reset" type="button">Repartir de zéro</button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>Semaine</h2>
      <div class="nav">
        <button type="button" id="prev" aria-label="Semaine précédente">‹</button>
        <span class="range" id="range"></span>
        <button type="button" id="next" aria-label="Semaine suivante">›</button>
      </div>
    </div>
    <div class="grid-scroll"><table id="week"></table></div>
    <form class="add" id="add-form">
      <label class="eyebrow" for="new-habit" hidden>Nouvelle habitude</label>
      <input id="new-habit" placeholder="Nouvelle habitude, ex. « Pas d'écran après 22 h »" maxlength="60" autocomplete="off">
      <button class="btn" type="submit">Ajouter</button>
    </form>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>18 dernières semaines</h2>
      <span class="eyebrow">habitudes cochées / jour</span>
    </div>
    <div class="heat-wrap">
      <div class="months" id="months"></div>
      <div class="heat" id="heat"></div>
    </div>
    <div class="legend">Moins <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i> Plus</div>
  </section>
</div>

<script>
(function(){
  const KEY = 'carnet-habitudes-v1';
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const monday = d => addDays(d, -((d.getDay() + 6) % 7));
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayIso = iso(today);
  const DAYS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  const fmtLong = new Intl.DateTimeFormat('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
  const fmtShort = new Intl.DateTimeFormat('fr-FR', {day: 'numeric', month: 'short'});
  const fmtTip = new Intl.DateTimeFormat('fr-FR', {weekday: 'short', day: 'numeric', month: 'long'});
  const fmtMonth = new Intl.DateTimeFormat('fr-FR', {month: 'short'});

  function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }

  function seed(){
    const habits = [
      {id: 'eau', name: 'Boire 1,5 L d’eau', p: .88},
      {id: 'lire', name: 'Lire 20 min', p: .62},
      {id: 'pas', name: 'Marcher 8 000 pas', p: .7},
      {id: 'medit', name: 'Méditer 10 min', p: .45},
      {id: 'dodo', name: 'Au lit avant 23 h', p: .55}
    ];
    const log = {};
    for (let i = 125; i >= 1; i--){
      const d = addDays(today, -i), k = iso(d);
      const warm = i < 40 ? .1 : 0; // on progresse ces dernières semaines
      const ids = habits.filter(h => hash(k + h.id) < h.p + warm).map(h => h.id);
      if (ids.length) log[k] = ids;
    }
    log[todayIso] = ['eau', 'pas'];
    return {sample: true, habits: habits.map(({id, name}) => ({id, name})), log};
  }

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.habits)) state = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  let weekStart = monday(today);
  const isDone = (k, id) => (state.log[k] || []).includes(id);

  function toggle(k, id){
    const arr = state.log[k] || [];
    state.log[k] = arr.includes(id) ? arr.filter(x => x !== id) : arr.concat(id);
    if (!state.log[k].length) delete state.log[k];
    save(); render();
  }

  function streak(id){
    let d = isDone(todayIso, id) ? today : addDays(today, -1), n = 0;
    while (isDone(iso(d), id)){ n++; d = addDays(d, -1); }
    return n;
  }

  function renderStats(){
    const n = state.habits.length;
    const doneToday = state.habits.filter(h => isDone(todayIso, h.id)).length;
    const ws = monday(today), elapsed = ((today.getDay() + 6) % 7) + 1;
    let hits = 0;
    for (let i = 0; i < elapsed; i++){ const k = iso(addDays(ws, i)); hits += state.habits.filter(h => isDone(k, h.id)).length; }
    const pct = n ? Math.round(hits / (n * elapsed) * 100) : 0;
    const best = state.habits.reduce((m, h) => Math.max(m, streak(h.id)), 0);
    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + doneToday + '/' + n + '</b><span>aujourd’hui</span></div>' +
      '<div class="stat"><b>' + pct + ' %</b><span>cette semaine</span></div>' +
      '<div class="stat"><b>' + best + ' j</b><span>meilleure série</span></div>';
  }

  function renderWeek(){
    const days = Array.from({length: 7}, (_, i) => addDays(weekStart, i));
    document.getElementById('range').textContent = fmtShort.format(days[0]) + ' – ' + fmtShort.format(days[6]);
    document.getElementById('next').disabled = +weekStart >= +monday(today);
    let html = '<thead><tr><th class="name" scope="col">Habitude</th>' +
      days.map((d, i) => '<th class="day' + (iso(d) === todayIso ? ' is-today' : '') + '" scope="col">' + DAYS[i] + '<small>' + d.getDate() + '</small></th>').join('') +
      '<th class="streak" scope="col">Série</th></tr></thead><tbody>';
    if (!state.habits.length) html += '<tr><td class="name" colspan="9" style="color:var(--muted);padding:14px 0">Ajoute ta première habitude ci-dessous.</td></tr>';
    for (const h of state.habits){
      const s = streak(h.id);
      html += '<tr><td class="name"><div class="hname"><span>' + esc(h.name) + '</span><button type="button" class="del" data-del="' + h.id + '" aria-label="Supprimer « ' + esc(h.name) + ' »">×</button></div></td>';
      for (const d of days){
        const k = iso(d), on = isDone(k, h.id), future = d > today;
        html += '<td class="cell' + (k === todayIso ? ' is-today' : '') + '"><button type="button" class="dot" data-day="' + k + '" data-id="' + h.id + '" aria-pressed="' + on + '"' + (future ? ' disabled' : '') + ' aria-label="' + esc(h.name) + ', ' + fmtTip.format(d) + '"></button></td>';
      }
      html += '<td class="streak' + (s >= 3 ? ' hot' : '') + '">' + s + ' j</td></tr>';
    }
    document.getElementById('week').innerHTML = html + '</tbody>';
  }

  function renderHeat(){
    const start = addDays(monday(today), -17 * 7), n = state.habits.length;
    let months = '<span></span>', lastM = -1;
    for (let w = 0; w < 18; w++){
      const d = addDays(start, w * 7), m = d.getMonth();
      months += '<span>' + (m !== lastM ? fmtMonth.format(d).replace('.', '') : '') + '</span>';
      lastM = m;
    }
    document.getElementById('months').innerHTML = months;
    let html = '';
    for (let r = 0; r < 7; r++){
      html += '<span class="lbl">' + (r % 2 === 0 ? DAYS[r] : '') + '</span>';
      for (let w = 0; w < 18; w++){
        const d = addDays(start, w * 7 + r), k = iso(d);
        if (d > today){ html += '<i class="future"></i>'; continue; }
        const c = state.habits.filter(h => isDone(k, h.id)).length;
        const ratio = n ? c / n : 0;
        // 0 = rien, 5 = tout coché ; entre les deux, 4 paliers pour que 1/5, 2/5, 3/5 et 4/5 restent distincts
        const lvl = c === 0 ? 0 : ratio >= 1 ? 5 : Math.min(4, Math.max(1, Math.ceil(ratio * 4)));
        html += '<i class="l' + lvl + (k === todayIso ? ' today' : '') + '" title="' + fmtTip.format(d) + ' — ' + c + '/' + n + '"></i>';
      }
    }
    document.getElementById('heat').innerHTML = html;
  }

  function render(){
    document.getElementById('today-label').textContent = fmtLong.format(today);
    document.getElementById('sample').hidden = !state.sample;
    renderStats(); renderWeek(); renderHeat();
  }

  document.getElementById('week').addEventListener('click', e => {
    const dot = e.target.closest('.dot');
    if (dot){ toggle(dot.dataset.day, dot.dataset.id); return; }
    const del = e.target.closest('.del');
    if (del){
      const h = state.habits.find(x => x.id === del.dataset.del);
      if (h && confirm('Supprimer « ' + h.name + ' » et son historique ?')){
        state.habits = state.habits.filter(x => x.id !== h.id);
        for (const k in state.log){ state.log[k] = state.log[k].filter(x => x !== h.id); if (!state.log[k].length) delete state.log[k]; }
        save(); render();
      }
    }
  });
  document.getElementById('prev').addEventListener('click', () => { weekStart = addDays(weekStart, -7); renderWeek(); });
  document.getElementById('next').addEventListener('click', () => { weekStart = addDays(weekStart, 7); renderWeek(); });
  document.getElementById('add-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('new-habit'), name = input.value.trim();
    if (!name) return;
    state.habits.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name});
    input.value = ''; save(); render();
  });
  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('Effacer l’historique d’exemple ? Tes habitudes restent en place.')) return;
    state.log = {}; state.sample = false; save(); render();
  });

  render();
})();
</script>

</html>
